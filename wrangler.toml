name = "atlaseduintelligence"
main = "src/index.ts"
compatibility_date = "2026-06-02"
# seal.ts hashes the sealed-reading chain with node:crypto's createHash.
compatibility_flags = ["nodejs_compat"]

# Serve the static marketing site (public/index.html + atlas-emblem.png).
# Non-asset paths (e.g. /api/*) fall through to the Worker in src/index.ts.
[assets]
directory = "public"
binding = "ASSETS"

# Bundle FACILITATOR.md as a Text module so src/education/index.ts can
# `import facilitatorStance from './FACILITATOR.md'` and get its contents.
# Typed by src/md-modules.d.ts.
[[rules]]
type = "Text"
globs = ["**/*.md"]

# Learner state: one JSON-document row per learner (edu_state table,
# created lazily by ensureEduSchema). Create with:
#   wrangler d1 create atlas-edu
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "atlas-edu"
database_id = "5290ccd5-1a0b-4e5e-a3c3-32545a77d048"

# Bearer-token door: token -> learnerId. Create with:
#   wrangler kv namespace create AUTH_TOKENS
# then paste the returned id below.
[[kv_namespaces]]
binding = "AUTH_TOKENS"
id = "45ace88cdd244f40aec377fb7e2fed3c"

# ADMIN_SECRET is a secret, not committed here. Set it with:
#   wrangler secret put ADMIN_SECRET
# (and put a value in .dev.vars for local dev — see .dev.vars.example).

[observability]
enabled = true
